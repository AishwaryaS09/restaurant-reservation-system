
services:
  backend:
    build:
      context: ./backend
    image: dinesync-backend:v1
    container_name: dinesync-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    image: dinesync-frontend:v1
    container_name: dinesync-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
