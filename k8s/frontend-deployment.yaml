
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dinesync-frontend
  labels:
    app: dinesync-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dinesync-frontend

  template:
    metadata:
      labels:
        app: dinesync-frontend

    spec:
      containers:
        - name: frontend
          image: dinesync-frontend:k8s
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
